spring.profiles.active=h2
spring.application.name=baozi-store
server.port=8080

# ---------- H2 ----------
# O banco "baozi_store" e criado automaticamente se nao existir.
# Ajuste usuario/senha conforme o seu H2 (ou use as variaveis de ambiente DB_USER e DB_PASSWORD).
spring.datasource.url=jdbc:h2:mem:baozi_store
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA / Hibernate ----------
# "update" cria/atualiza as tabelas automaticamente a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
